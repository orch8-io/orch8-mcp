name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm ci
      - name: Validate server.json against the registry schema and lint client snippets
        run: npm test
      - name: Vendored schema matches the upstream $schema URL
        run: |
          url="$(node -p 'require("./server.json")["$schema"]')"
          curl -fsSL "$url" -o /tmp/upstream.schema.json
          node -e '
            const a = JSON.stringify(require("/tmp/upstream.schema.json"));
            const b = JSON.stringify(require("./schema/server.schema.2025-12-11.json"));
            if (a !== b) { console.error("vendored schema differs from", process.argv[1]); process.exit(1); }
            console.log("vendored schema matches upstream");
          ' "$url"
