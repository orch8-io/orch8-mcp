name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  # mcp-publisher release pinned by version + sha256 (from registry_1.8.1_checksums.txt)
  MCP_PUBLISHER_VERSION: v1.8.1
  MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    env:
      MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
      - name: Bundle client configs
        run: |
          mkdir dist
          cp server.json dist/server.json
          zip -r "dist/orch8-mcp-clients-$GITHUB_REF_NAME.zip" clients README.md LICENSE
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag \
            --notes "server.json version: $(node -p 'require("./server.json").version')"
      - name: Install mcp-publisher
        if: env.MCP_PRIVATE_KEY != ''
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - name: Publish to the MCP Registry (only when the MCP_PRIVATE_KEY secret is set)
        if: env.MCP_PRIVATE_KEY != ''
        run: |
          ./mcp-publisher login dns --domain orch8.io --private-key "$MCP_PRIVATE_KEY"
          ./mcp-publisher publish
      - name: Skip MCP Registry publish
        if: env.MCP_PRIVATE_KEY == ''
        run: echo "::notice::MCP_PRIVATE_KEY secret not set; skipped mcp-publisher publish."
